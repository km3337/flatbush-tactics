html/head_include="<style>#canvas { image-rendering: pixelated; }</style>
<script>
// iOS Safari audio. 'playback' lets game audio play with the ring/silent
// switch on silent (Web Audio is muted by it otherwise). iOS also only starts
// audio inside a touch, and suspends it when the app is backgrounded, so
// resume every audio context on each tap/key and when the page comes back.
(function () {
	try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
	var contexts = [];
	['AudioContext', 'webkitAudioContext'].forEach(function (name) {
		var Base = window[name];
		if (!Base) return;
		var Tracked = function (options) {
			var context = new Base(options);
			contexts.push(context);
			return context;
		};
		Tracked.prototype = Base.prototype;
		window[name] = Tracked;
	});
	function resume() {
		contexts.forEach(function (context) {
			if (context.state !== 'running' && context.state !== 'closed') context.resume().catch(function () {});
		});
	}
	['touchend', 'pointerup', 'mousedown', 'keydown'].forEach(function (type) {
		window.addEventListener(type, resume, { capture: true, passive: true });
	});
	document.addEventListener('visibilitychange', function () { if (!document.hidden) resume(); });
})();
</script>"
